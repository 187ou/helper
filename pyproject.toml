[project]
name = "desktop-assistant"
version = "0.1.0"
description = "私有化本地桌面智能助手"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyQt6>=6.7.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "schedule>=1.2.0",
    "tokenizers>=0.22.0,<=0.23.0",
    "sentence-transformers>=2.0",
    "openai>=1.0.0",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0.0",
]

